spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

spring.application.name=SmartRide
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartride}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_CONNECTION_MAX_LIFETIME_MS:600000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Admin bootstrap credentials must be supplied by the environment.
smartride.admin.email=${ADMIN_EMAIL:admin@smartride.com}
smartride.admin.password=${ADMIN_PASSWORD:}
smartride.admin.name=${ADMIN_NAME:SmartRide Administrator}
smartride.admin.initialization-enabled=${ADMIN_INITIALIZATION_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
smartride.uploads.vendor-dir=${SMARTRIDE_VENDOR_UPLOAD_DIR:./private-uploads/vendors}
smartride.uploads.driver-dir=${SMARTRIDE_DRIVER_UPLOAD_DIR:./private-uploads/drivers}
smartride.uploads.customer-kyc-dir=${SMARTRIDE_CUSTOMER_KYC_UPLOAD_DIR:./private-uploads/customer-kyc}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smartride.frontend.url=${FRONTEND_URL:http://localhost:5173}
