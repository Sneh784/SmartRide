server.port=${SERVER_PORT:8080}

spring.application.name=SmartRide
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartride_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:sonali}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=SmartRide2026SecureJwtSecretKeyForHS256!
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin bootstrap credentials must be supplied by the environment.
smartride.admin.email=${ADMIN_EMAIL:admin@smartride.com}
smartride.admin.password=${ADMIN_PASSWORD:}
smartride.admin.name=${ADMIN_NAME:SmartRide Administrator}
smartride.admin.initialization-enabled=${ADMIN_INITIALIZATION_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
smartride.uploads.vendor-dir=${SMARTRIDE_VENDOR_UPLOAD_DIR:./private-uploads/vendors}
